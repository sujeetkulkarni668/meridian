[package]
name = "meridian_core"
version = "0.1.0"
edition = "2021"
description = "MERIDIAN: The Autonomous Agent Economy - Escrow, Registry and Settlement Smart Contract"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.5.0", features = ["legacy", "unit-testing"] }
borsh = { version = "1.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
